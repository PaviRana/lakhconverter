<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakh to Amount Converter</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    background:#fff;
    width:420px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
    box-sizing:border-box;
}

.result{
    background:#f8f9fa;
    padding:20px;
    border-radius:10px;
}

.amount{
    font-size:30px;
    font-weight:bold;
    color:#28a745;
    margin-bottom:15px;
    text-align:center;
}

.words{
    font-size:16px;
    color:#444;
    line-height:1.5;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

    <h2>Lakh Converter</h2>

    <input
        type="number"
        id="amount"
        placeholder="Enter Amount in Lakhs"
        step="0.01"
        oninput="convertAmount()"
    >

    <div class="result">

        <div class="amount" id="convertedAmount">
            ₹ 0
        </div>

        <div class="words" id="amountWords">
            Amount in words
        </div>

    </div>

</div>

<script>

function formatIndian(num){

    return new Intl.NumberFormat('en-IN').format(num);

}

function convertAmount(){

    let amount = parseFloat(
        document.getElementById("amount").value
    );

    if(isNaN(amount)){

        document.getElementById("convertedAmount").innerHTML = "₹ 0";

        document.getElementById("amountWords").innerHTML =
            "Amount in words";

        return;
    }

    // Convert Lakhs to Actual Amount
    let converted = amount * 100000;

    document.getElementById("convertedAmount").innerHTML =
        "₹ " + formatIndian(converted);

    document.getElementById("amountWords").innerHTML =
        numberToWords(converted);

}

function numberToWords(num){

    if(num === 0) return "Zero Rupees";

    const ones = [
        "", "One", "Two", "Three", "Four",
        "Five", "Six", "Seven", "Eight",
        "Nine", "Ten", "Eleven", "Twelve",
        "Thirteen", "Fourteen", "Fifteen",
        "Sixteen", "Seventeen", "Eighteen",
        "Nineteen"
    ];

    const tens = [
        "", "", "Twenty", "Thirty", "Forty",
        "Fifty", "Sixty", "Seventy",
        "Eighty", "Ninety"
    ];

    function convert(n){

        if(n < 20)
            return ones[n];

        if(n < 100)
            return tens[Math.floor(n/10)] +
            (n%10 ? " " + ones[n%10] : "");

        if(n < 1000)
            return ones[Math.floor(n/100)] +
            " Hundred " +
            (n%100 ? convert(n%100) : "");

        if(n < 100000)
            return convert(Math.floor(n/1000)) +
            " Thousand " +
            (n%1000 ? convert(n%1000) : "");

        if(n < 10000000)
            return convert(Math.floor(n/100000)) +
            " Lakh " +
            (n%100000 ? convert(n%100000) : "");

        return convert(Math.floor(n/10000000)) +
            " Crore " +
            (n%10000000 ? convert(n%10000000) : "");
    }

    return convert(Math.floor(num)) + " Rupees";

}

</script>

</body>
</html>
